<div class="student-home-container">
  <!-- En-tête -->
  <header class="header">
    <div class="logo-container">
      <img src="assets/logos.png" alt="Logo de l'application" class="logo">
    </div>
    <span >Ma playlist</span>
    <div class="user-info">
      <span>Bienvenue, Étudiant !</span>
      <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>account_circle</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="viewProfile()">Profil</button>
        <button mat-menu-item (click)="logout()">Déconnexion</button>
      </mat-menu>
    </div>
  </header>

  <!-- Barre de recherche -->
  <div class="search-bar">
    <mat-form-field appearance="outline" class="search-form-field">
      <input matInput placeholder="Rechercher un cours" [(ngModel)]="searchQuery">
      <button mat-icon-button matSuffix (click)="searchCourses()" class="search-button">
        <mat-icon>search</mat-icon>
      </button>
    </mat-form-field>

  </div>


  <!-- Liste des cours -->
  <h2>Cours Disponibles</h2>
  <div class="course-list">
    <div *ngFor="let course of courses" class="course-card">
      <mat-card>
        <!-- Image pour chaque cours -->
        <img src="assets/cours.png" alt="Image du cours" class="course-image">
        <mat-card-header>
          <mat-card-title>{{ course.titre }}</mat-card-title>
          <mat-card-subtitle>{{ course.categorie }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p>{{ course.description }}</p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button (click)="viewCourse(course.id)">Voir le cours</button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>

  <!-- Recommandations -->
  <h2>Recommandations pour vous</h2>
  <div class="recommendations">
    <div *ngFor="let recommendation of recommendations" class="recommendation-card">
      <mat-card>
        <!-- Image pour chaque recommandation -->
        <img src="assets/cours.png" alt="Image du cours" class="course-image">
        <mat-card-header>
          <mat-card-title>{{ recommendation.titre }}</mat-card-title>
          <mat-card-subtitle>{{ recommendation.categorie }}</mat-card-subtitle>
        </mat-card-header>
        <mat-card-content>
          <p>{{ recommendation.description }}</p>
        </mat-card-content>
        <mat-card-actions>
          <button mat-button (click)="viewCourse(recommendation.id)">Voir le cours</button>
        </mat-card-actions>
      </mat-card>
    </div>
  </div>
</div>
<app-footer></app-footer>
